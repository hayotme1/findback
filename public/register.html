<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindBack</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232563eb'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>F</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/i18n.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/ui.js" defer></script>
  <script src="/js/pages/register.js" defer></script>
</head>
<body>
  <main class="container auth">
    <div class="panel">
      <h1 data-i18n="auth.registerTitle"></h1>
      <div id="alert" hidden></div>
      <form id="registerForm" class="form">
        <label><span data-i18n="auth.fullName"></span><input name="full_name" required autocomplete="name"></label>
        <label><span data-i18n="auth.email"></span><input name="email" type="email" required autocomplete="email"></label>
        <label><span data-i18n="auth.password"></span>
          <input name="password" type="password" required minlength="6" autocomplete="new-password">
          <small class="muted" data-i18n="auth.passwordHint"></small></label>
        <label><span data-i18n="auth.phone"></span><input name="phone" type="tel" autocomplete="tel" placeholder="+998 90 123 45 67"></label>
        <label><span data-i18n="auth.faculty"></span><input name="faculty"></label>
        <button type="submit" class="btn btn-block" data-i18n="auth.registerBtn"></button>
      </form>
      <p class="muted center"><span data-i18n="auth.haveAccount"></span> <a href="/login.html" data-i18n="nav.login"></a></p>
    </div>
  </main>
</body>
</html>
